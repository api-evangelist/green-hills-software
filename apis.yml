aid: green-hills-software
name: Green Hills Software
description: >-
  Green Hills Software is a privately held embedded software company founded in 1982 by Dan O'Dowd
  and Carl Rosenberg and headquartered in Santa Barbara, California. It builds safety- and
  security-certified real-time operating systems (INTEGRITY, INTEGRITY-178 tuMP, u-velOSity),
  embedded hypervisors (INTEGRITY Multivisor, u-visor), optimizing C/C++/Ada/Fortran compilers,
  the MULTI and AdaMULTI integrated development environments, the TimeMachine back-in-time debug
  suite, the DoubleCheck static analyzer, the Green Hills Probe hardware debugger, and networking,
  file-system and USB middleware. Its customers ship these components inside aerospace, defense,
  automotive, medical, industrial, rail, telecommunications and consumer devices. Green Hills is a
  toolchain and operating-system vendor rather than an API provider: the programmable interfaces it
  ships are in-product C/C++, POSIX and MULTI-Python scripting APIs delivered with a licensed
  installation and documented in manuals distributed with the product, and its technical support
  portal at support.ghs.com requires an account. No public web API, developer portal, or
  machine-readable API description was found on any Green Hills host during enrichment.
